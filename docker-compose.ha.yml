# High-availability deployment example: two stateless cloudit replicas behind a Caddy
# load balancer, sharing PostgreSQL, S3-compatible storage (Garage) and Valkey.
#
#   make up-ha     # build and start everything; http://localhost:8080
#   make down-ha   # stop (data volumes are kept)
#   docker compose -f docker-compose.ha.yml down -v   # stop and delete all data
#
# `make test-ha` starts only postgres, garage and valkey from this file
# (as project `cloudit-test`) and runs the server tests against them.
#
# The credentials below are for local testing only: change them for a real deployment
# (and keep them in an env file, not here). Backing services publish ports on
# 127.0.0.1 only, on random host ports (`docker compose -f docker-compose.ha.yml port
# postgres 5432` shows which), for debugging and `make test-ha`.
#
# Any S3-compatible service works in place of Garage (AWS S3, RustFS, SeaweedFS…), and
# Redis works in place of Valkey.

name: cloudit-ha

x-cloudit: &cloudit
  image: cloudit:ha
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://cloudit:cloudit-dev-password@postgres:5432/cloudit
    DB_MAX_CONNECTIONS: '10'
    STORAGE: s3
    S3_ENDPOINT: http://garage:3900
    # Garage's region is whatever s3_region says in docker/garage.toml.
    S3_REGION: garage
    S3_BUCKET: cloudit
    S3_ACCESS_KEY_ID: GK636c6f756469742d74657374
    S3_SECRET_ACCESS_KEY: 636c6f756469742d6465762d7365637265742d6e6f742d666f722d70726f6421
    S3_FORCE_PATH_STYLE: 'true'
    # Presigned URLs need an S3 endpoint the clients can reach (S3_PUBLIC_ENDPOINT);
    # here Garage is private, so the server proxies blobs.
    S3_PRESIGN: 'false'
    REDIS_URL: redis://valkey:6379
    # Caddy is the only way in: trust its X-Forwarded-* headers (client IP for rate
    # limits, https detection). Never enable this when clients can reach the replicas
    # directly. Set PUBLIC_URL to the address users open (e.g. https://sync.example.com).
    TRUST_PROXY_HEADERS: 'true'
  depends_on:
    postgres:
      condition: service_healthy
    garage:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudit
      POSTGRES_PASSWORD: cloudit-dev-password
      POSTGRES_DB: cloudit
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory of this path.
      - postgres:/var/lib/postgresql
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloudit -d cloudit']
      interval: 2s
      timeout: 5s
      retries: 30

  # Garage, single node: `--single-node` lays out the cluster and `--default-bucket`
  # creates the bucket and an access key from the GARAGE_DEFAULT_* variables at startup,
  # so no init job is needed. Config: docker/garage.toml (example secrets, dev only).
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      # Garage key ids are `GK` + 24 hex digits, secrets 64 hex digits.
      GARAGE_DEFAULT_ACCESS_KEY: GK636c6f756469742d74657374
      GARAGE_DEFAULT_SECRET_KEY: 636c6f756469742d6465762d7365637265742d6e6f742d666f722d70726f6421
      GARAGE_DEFAULT_BUCKET: cloudit
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    ports:
      - '127.0.0.1::3900'
    healthcheck:
      # The image has no shell or curl: the garage CLI itself checks that the bucket exists.
      test: ['CMD', '/garage', 'bucket', 'info', 'cloudit']
      interval: 2s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # Only one replica builds the shared image (two `build:` keys for the same tag make
  # `up --build` fail); the other reuses it and never tries to pull it.
  cloudit-1:
    <<: *cloudit
    build: .

  cloudit-2:
    <<: *cloudit
    pull_policy: never

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - cloudit-1
      - cloudit-2

volumes:
  postgres:
  garage:
  caddy:
