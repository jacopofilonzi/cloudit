[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
cloudit-core = { path = "crates/core" }
anyhow = "1.0.104"
fastcdc = "5.0.0"
hex = "0.4.3"
sha2 = "0.11.1"
zstd = "0.14.3"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
http-body-util = "0.1.5"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
object_store = { version = "0.14.2", features = ["aws"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.29.1", features = ["v4", "v7"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
url = "2.5.8"
futures = "0.3.34"
bytes = "1.12.1"
tempfile = "3.27.0"
# Auth (server): password hashing, token randomness/encoding, constant-time compares.
argon2 = "0.6.0"
getrandom = "0.4.3"
base64 = "0.23.1"
subtle = "2.6.1"
# Outgoing HTTP: identity providers (tests: also presigned URL checks). Already in the
# tree through object_store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Identity providers: OIDC / OAuth2 without a bundled HTTP client (requests go through
# our reqwest), and encryption of provider client secrets at rest.
openidconnect = { version = "4.1.0", default-features = false, features = ["accept-string-booleans"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# ZIP download of a snapshot: streaming writer (data descriptors, ZIP64) over tokio.
async_zip = { version = "0.0.19", default-features = false, features = ["tokio", "deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
