name: CI

# Checks and tests only: no artifacts are built or published here (see release.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri 2 Linux prerequisites (the desktop crate is part of the workspace).
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - run: pnpm install --frozen-lockfile

      # pwsh on Windows, so the Makefile recipes are exercised under cmd.exe too.
      # (`shell` can't take an expression: one step per OS.)
      - name: make check
        if: runner.os != 'Windows'
        shell: bash
        run: make check

      - name: make check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make check

  # Server tests against real PostgreSQL, S3 (Garage) and Valkey: the same tests as
  # `make test-ha`. Without these TEST_* variables the tests use SQLite and skip S3/Redis.
  server-services:
    name: server tests (PostgreSQL, Garage, Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cloudit
          POSTGRES_PASSWORD: cloudit-ci
          POSTGRES_DB: cloudit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudit -d cloudit"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://cloudit:cloudit-ci@127.0.0.1:5432/cloudit
      # Example Garage credentials, as in docker-compose.ha.yml (key ids are GK + 24 hex).
      TEST_S3_ENDPOINT: http://127.0.0.1:3900
      TEST_S3_REGION: garage
      TEST_S3_BUCKET: cloudit
      TEST_S3_ACCESS_KEY_ID: GK636c6f756469742d74657374
      TEST_S3_SECRET_ACCESS_KEY: 636c6f756469742d6465762d7365637265742d6e6f742d666f722d70726f6421
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      # Service containers can't take a command or mount repository files, so Garage is
      # started with `docker run`; --single-node/--default-bucket create the cluster
      # layout, the bucket and the key from the GARAGE_DEFAULT_* variables.
      - name: Start Garage
        run: |
          docker run -d --name garage -p 3900:3900 \
            -v "$PWD/docker/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$TEST_S3_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$TEST_S3_SECRET_ACCESS_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$TEST_S3_BUCKET" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
          for i in $(seq 1 60); do
            docker exec garage /garage bucket info "$TEST_S3_BUCKET" >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs garage
          exit 1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (server)
        run: cargo test -p cloudit-server --locked
