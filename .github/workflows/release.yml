name: Release

# Builds and publishes artifacts only for version tags or a manual run, never on a
# plain push.
#
# - Tag `vX.Y.Z`: checks the tag against the versions in Cargo.toml and tauri.conf.json,
#   creates a draft GitHub Release, builds the desktop installers into it (Windows NSIS,
#   Linux AppImage + deb, their updater signatures and `latest.json`), then publishes
#   it; pushes the Docker image to ghcr.io for linux/amd64 and linux/arm64 (each built
#   natively on its own runner, pushed by digest, then joined into one multi-arch tag).
# - Manual run without a tag: builds the same installers (unsigned for the updater) as
#   workflow artifacts and the Docker image; no release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (the updater signing key, see README "Releases")
# and, if the key has one, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

  draft:
    name: Draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Created through the API so the id comes from the answer itself (a draft is
          # not reliably listed right after its creation).
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" -f name="cloudit $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop installers (${{ matrix.os }})
    needs: draft
    # A manual run has no draft (the jobs before are skipped): build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      # One at a time: each job rewrites latest.json in the release.
      max-parallel: 1
      matrix:
        # 22.04: an older glibc, so the AppImage and the deb run on more distributions.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # Tauri 2 build prerequisites, plus what the AppImage bundler runs (patchelf, file).
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libgtk-3-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf file

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Releases also build the signed updater packages (tauri.updater.conf.json).
          args: ${{ needs.draft.outputs.id && '--config src-tauri/tauri.updater.conf.json' || '' }}
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: cloudit ${{ github.ref_name }}
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: ${{ !needs.draft.outputs.id }}

  publish:
    name: Publish release
    needs: [draft, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

  # One native build per platform (no QEMU: emulating a Rust release build takes hours),
  # each pushed by digest only; `docker-manifest` then tags the multi-arch image.
  docker:
    name: Docker image (${{ matrix.platform }})
    needs: version
    # A manual run has no version check (skipped): build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/${{ github.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker image (multi-arch tags)
    needs: docker
    # `version` is skipped on a manual run: without this the skip would propagate here.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        env:
          META: ${{ steps.meta.outputs.json }}
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$META")"
