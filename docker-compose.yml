# Single-instance deployment: SQLite database and filesystem blobs under ./data
# (/data in the container: cloudit.db, blobs/, backups/). Settings go in .env (see
# .env.example). For several instances behind a load balancer (PostgreSQL, S3-compatible
# storage, Valkey/Redis) see docker-compose.ha.yml.
services:
  cloudit:
    build: .
    image: cloudit:local
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
