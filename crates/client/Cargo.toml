[package]
name = "cloudit-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cloudit-core.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
getrandom.workspace = true
globset.workspace = true
hex.workspace = true
keyring-core.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true

# OS keychains through keyring-core stores (no system libraries needed to build).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[dev-dependencies]
# Integration tests run the real server in-process.
cloudit-server = { path = "../server" }
axum.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
