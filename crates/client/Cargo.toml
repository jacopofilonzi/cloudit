[package]
name = "cloudit-client"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
ts = ["dep:ts-rs"]

[dependencies]
cloudit-core.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
getrandom.workspace = true
globset.workspace = true
hex.workspace = true
keyring-core.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
# TypeScript bindings of the types the desktop UI receives (`make types`).
ts-rs = { workspace = true, optional = true }

# OS keychains through keyring-core stores (no system libraries needed to build).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[dev-dependencies]
# Integration tests run the real server in-process.
cloudit-server = { path = "../server" }
axum.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
