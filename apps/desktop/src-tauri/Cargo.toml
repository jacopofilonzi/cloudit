[package]
name = "cloudit-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "cloudit desktop app (Tauri 2)"

[features]
# Set by `tauri build`: serve the embedded UI instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloudit-client = { path = "../../../crates/client" }
cloudit-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Automatic sync: file watching and the list of running programs.
notify = "8.2.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tracing-appender = "0.2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true

[dev-dependencies]
# The client types the UI receives are exported to TypeScript with the app's own.
cloudit-client = { path = "../../../crates/client", features = ["ts"] }
ts-rs.workspace = true
# Paused time for the scheduler tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
